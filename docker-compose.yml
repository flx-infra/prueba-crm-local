version: '3.8'

services:
  backend:
    image: fabreguesm/omnicanalidad-backend:2.0.21
    restart: unless-stopped
    extra_hosts:       
      - "crmlocalpruebaapi.flexxus.com.ar:10.250.0.98"
    environment:
      TZ: America/Argentina/Buenos_Aires
      PORT: 6021
      NODE_ENV: ${NODE_ENV:-production}
      BACKEND_URL: ${BACKEND_URL:-http://10.250.0.98:6021}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://10.250.0.98:6383}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      SALT_ROUNDS: ${SALT_ROUNDS:-10}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_WEBHOOK_SECRET: ${META_WEBHOOK_SECRET}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      IG_PAGE_ID: ${IG_PAGE_ID}
      META_API_DEMO_MODE: ${META_API_DEMO_MODE:-false}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${FACEBOOK_PAGE_ACCESS_TOKEN}
      FACEBOOK_PAGE_ID: ${FACEBOOK_PAGE_ID}
      FACEBOOK_WEBHOOK_SECRET: ${FACEBOOK_WEBHOOK_SECRET}
      USE_DISPATCHER: ${USE_DISPATCHER:-false}
      DISPATCHER_URL: ${DISPATCHER_URL:-http://localhost:8081}
      DISPATCHER_API_KEY: ${DISPATCHER_API_KEY}
      META_APP_SECRET: ${META_APP_SECRET}
      AUTO_ASSIGN_ENABLED: ${AUTO_ASSIGN_ENABLED:-true}
      MAX_CONVERSATIONS_PER_VENDOR: ${MAX_CONVERSATIONS_PER_VENDOR:-10}
      REASSIGN_INACTIVE_AFTER_MINUTES: ${REASSIGN_INACTIVE_AFTER_MINUTES:-60}
      ESCALATE_TO_MANAGER_AFTER_HOURS: ${ESCALATE_TO_MANAGER_AFTER_HOURS:-4}
      AUTO_CLOSE_AFTER_DAYS: ${AUTO_CLOSE_AFTER_DAYS:-1}
      AUTO_CLOSE_INPROGRESS_AFTER_DAYS: ${AUTO_CLOSE_INPROGRESS_AFTER_DAYS:-3}
      AUTO_CLOSE_INPROGRESS_ENABLED: ${AUTO_CLOSE_INPROGRESS_ENABLED:-true}
      WA_DEFAULT_TEMPLATE: ${WA_DEFAULT_TEMPLATE:-Conversacion Cerrada por expiracion 24 hs.}
      RULES_ENGINE_VERSION: ${RULES_ENGINE_VERSION:-v1}
      RULES_ENABLE_MULTIPLE_MATCHES: ${RULES_ENABLE_MULTIPLE_MATCHES:-false}
      RULES_ENABLE_VALIDATION: ${RULES_ENABLE_VALIDATION:-true}
      EMAIL_POLL_INTERVAL_SECONDS: ${EMAIL_POLL_INTERVAL_SECONDS:-120}
      EMAIL_CREDENTIALS_ENCRYPTION_KEY: ${EMAIL_CREDENTIALS_ENCRYPTION_KEY}
      EMAIL_MAX_FETCH_PER_POLL: ${EMAIL_MAX_FETCH_PER_POLL:-50}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ERP_API_URL: ${ERP_API_URL:-http://10.250.0.98:5019}
      ERP_API_USERNAME: ${ERP_API_USERNAME}
      ERP_API_PASSWORD: ${ERP_API_PASSWORD}
      ERP_API_DEVICE_UUID: ${ERP_API_DEVICE_UUID}
      ERP_API_DEVICE_MODEL: ${ERP_API_DEVICE_MODEL:-Omnicanalidad}
      ERP_API_DEVICE_PLATFORM: ${ERP_API_DEVICE_PLATFORM:-nodejs}
      ERP_API_DEVICE_VERSION: ${ERP_API_DEVICE_VERSION:-1.0.0}
      ERP_API_DEVICE_MANUFACTURER: ${ERP_API_DEVICE_MANUFACTURER:-Internal}
      ERP_API_TIMEOUT: ${ERP_API_TIMEOUT:-30000}
      FRONTEND_URL: ${FRONTEND_URL:-http://10.250.0.98:6002}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY:-dev-external-key-change-in-production}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN}
    depends_on:
      - redis-prueba-local
    ports:
      - "6021:6021"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6021/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      placement:
        constraints:
          - ${NODE}
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.${SERVICE_NAME}.entrypoints=web"
        - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.middlewares.${SERVICE_NAME}-http.redirectscheme.scheme=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.rule=Host(`${DOMAIN_NAME}`)"
        - "traefik.http.routers.${SERVICE_NAME}-https.entrypoints=https"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls=true"
        - "traefik.http.routers.${SERVICE_NAME}-https.tls.certresolver=myresolver"
        - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=6001"           
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

  frontend:
    image: fabreguesm/omnicanalidad-frontend:2.0.21
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:6022/api}
      REACT_APP_SHOW_WORKFLOWS: ${REACT_APP_SHOW_WORKFLOWS:-true}
      REACT_APP_SHOW_RULES_BANNER: ${REACT_APP_SHOW_RULES_BANNER:-false}
      REACT_APP_SHOW_CRM: ${REACT_APP_SHOW_CRM:-true}
      # Upstream interno para que nginx proxypasee /api/admin/queues (Bull Board)
      # al backend manteniendo mismo origen que el SPA (necesario para el cookie auth).
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://10.250.0.98:6021}
    ports:
      - "${FRONTEND_PORT:-6022}:80"
    networks:
      - traefik
    depends_on:
      - backend
    deploy:
      placement:
        constraints:
          - ${NODE}
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}
        
  filebrowser:
    image: hurlenko/filebrowser:v2.10.0
    user: "0:0"
    ports:
      - 8080
    volumes:
      - node_data:/data
      - factura_data:/data/factura_electronica
      - pdf_data:/data/pdf
      - fb_data:/data/config
      - backend_uploads:/data/app/uploads
      - backend_crm_documents:/data/app/documents
      - backend_logs:/data/app/logs
    deploy:
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FQDN_NOTDOT}-http-fb.entrypoints=web"
      - "traefik.http.routers.${FQDN_NOTDOT}-http-fb.rule=Host(`${PS_DOMAIN_FRONTEND}`) && PathPrefix(`/filebrowser`) || Host(`www.${PS_DOMAIN_FRONTEND}`) && PathPrefix(`/filebrowser`)"
      - "traefik.http.routers.${FQDN_NOTDOT}-http-fb.middlewares=https_redirect"
      - "traefik.http.routers.${FQDN_NOTDOT}-https-fb.rule=Host(`${PS_DOMAIN_FRONTEND}`) && PathPrefix(`/filebrowser`) || Host(`www.${PS_DOMAIN_FRONTEND}`) && PathPrefix(`/filebrowser`)"
      - "traefik.http.routers.${FQDN_NOTDOT}-https-fb.entrypoints=https"
      - "traefik.http.routers.${FQDN_NOTDOT}-https-fb.tls=true"
      - "traefik.http.services.${FQDN_NOTDOT}-https-fb.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.https_redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${FQDN_NOTDOT}-https-fb.middlewares=RuleGrpSlash"
      placement:
        constraints: ["${NODE}"]
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      - FB_PASSWORD=$$2a$$10$$v174TC2HFsPfoEXMkXlrH.wpmUzGsUPpnSf.xOUp1IK1s4tndTKFy
      - FB_BASEURL=/filebrowser/
    restart: always
    networks:
      - traefik

  filebrowser2:
    image: hurlenko/filebrowser:v2.10.0
    user: "0:0"
    ports:
      - 8080
    volumes:
      - node_data:/data
      - factura_data:/data/factura_electronica
      - pdf_data:/data/pdf
      - fb_data2:/data/config
    deploy:
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-http-fb.entrypoints=web"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-http-fb.rule=Host(`${PS_DOMAIN}`) && PathPrefix(`/filebrowser`) || Host(`www.${PS_DOMAIN}`) && PathPrefix(`/filebrowser`)"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-http-fb.middlewares=https_redirect"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https-fb.rule=Host(`${PS_DOMAIN}`) && PathPrefix(`/filebrowser`) || Host(`www.${PS_DOMAIN}`) && PathPrefix(`/filebrowser`)"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https-fb.entrypoints=https"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https-fb.tls=true"
      - "traefik.http.services.${FQDN_NOTDOT_API}-https-fb.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.https_redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https-fb.middlewares=RuleGrpSlash"
      placement:
        constraints: ["${NODE}"]
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    environment:
      - FB_PASSWORD=$$2a$$10$$v174TC2HFsPfoEXMkXlrH.wpmUzGsUPpnSf.xOUp1IK1s4tndTKFy
      - FB_BASEURL=/filebrowser/
    restart: always
    networks:
      - traefik

  nodejs:
    image: fabreguesm/flxwebapi-v4:2.8.336.2
    ports:
      - 5000
    networks:
      - traefik
      - default
    volumes:
      - 'node_data:/app/data/'
      - 'factura_data:/app/factura_electronica/'
      - 'pdf_data:/app/public/pdf/'
    deploy:
      labels:
      - "traefik.enable=true" 
      - "traefik.http.routers.${FQDN_NOTDOT_API}-http.entrypoints=web" 
      - "traefik.http.routers.${FQDN_NOTDOT_API}-http.rule=Host(`${PS_DOMAIN}`)" 
      - "traefik.http.middlewares.${FQDN_NOTDOT_API}-http.redirectscheme.scheme=https"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https.rule=Host(`${PS_DOMAIN}`)"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https.entrypoints=https"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https.tls=true"
      - "traefik.http.routers.${FQDN_NOTDOT_API}-https.tls.certresolver=myresolver"
      - "traefik.http.services.${FQDN_NOTDOT_API}-http.loadbalancer.server.port=5000"
      placement:
        constraints: ["${NODE}"]
      resources:
        limits:
          cpus: '2.0'
          memory: 2.0G
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

  redis-prueba-local:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      placement:
        constraints:
          - ${NODE}
      restart_policy:
        condition: on-failure
        max_attempts: 3

  worker:
    image: fabreguesm/omnicanalidad-backend:2.0.21
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s  
    environment:
      TZ: America/Argentina/Buenos_Aires
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://10.250.0.98:6383}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      EMAIL_POLL_INTERVAL_SECONDS: ${EMAIL_POLL_INTERVAL_SECONDS:-120}
      EMAIL_CREDENTIALS_ENCRYPTION_KEY: ${EMAIL_CREDENTIALS_ENCRYPTION_KEY}
      EMAIL_MAX_FETCH_PER_POLL: ${EMAIL_MAX_FETCH_PER_POLL:-50}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN}
      META_WEBHOOK_SECRET: ${META_WEBHOOK_SECRET}
      WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      ERP_API_URL: ${ERP_API_URL:-http://10.250.0.98:5019}
      ERP_API_USERNAME: ${ERP_API_USERNAME}
      ERP_API_PASSWORD: ${ERP_API_PASSWORD}
      ERP_API_DEVICE_UUID: ${ERP_API_DEVICE_UUID}
      ERP_API_DEVICE_MODEL: ${ERP_API_DEVICE_MODEL:-Omnicanalidad}
      ERP_API_DEVICE_PLATFORM: ${ERP_API_DEVICE_PLATFORM:-nodejs}
      ERP_API_DEVICE_VERSION: ${ERP_API_DEVICE_VERSION:-1.0.0}
      ERP_API_DEVICE_MANUFACTURER: ${ERP_API_DEVICE_MANUFACTURER:-Internal}
      ERP_API_TIMEOUT: ${ERP_API_TIMEOUT:-30000}
      WORKFLOW_MAX_CONCURRENT: ${WORKFLOW_MAX_CONCURRENT:-10}
      WORKFLOW_MAX_PER_COMPANY: ${WORKFLOW_MAX_PER_COMPANY:-5}
      SCHEDULER_MAX_CONCURRENT: ${SCHEDULER_MAX_CONCURRENT:-2}
      SCHEDULER_EXECUTION_TIMEOUT_MS: ${SCHEDULER_EXECUTION_TIMEOUT_MS:-600000}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=2048}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOADS_DIR: ${UPLOADS_DIR:-/app/uploads}
      IG_ACCESS_TOKEN: ${UPLOADS_DIR}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    deploy:
      placement:
        constraints:
          - ${NODE}
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}

networks:
  traefik:
    name: traefik-network
    external: true

volumes:
  backend_uploads:
    name: pruebalocal-backend-uploads
  backend_crm_documents:
    name: pruebalocal-backend-crm-documents
  backend_logs:
    name: pruebalocal-backend-logs
  redis_data:
    name: pruebalocal-redis-data-omnicanalidad
  node_data:
    name: "${FQDN_NOTDOT}_node-data"
  factura_data:
    name: "${FQDN_NOTDOT}_factura-data"
  pdf_data:
    name: "${FQDN_NOTDOT}_pdf-data"
  fb_data:
    name: "${FQDN_NOTDOT}_fbrowser-data"
  fb_data2:
    name: "${FQDN_NOTDOT_API}_fbrowser-data2"    
